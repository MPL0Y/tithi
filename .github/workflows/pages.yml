# Each January, regenerate the festival pages for the new year and next, and push (which deploys).
name: Yearly festival pages
on:
  schedule: [{ cron: '0 1 1 1 *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save astronomy-engine && node test.js && node pages.js
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A festival festivals sitemap.xml
          git diff --cached --quiet || { git commit -m "Festival pages for $(date -u +%Y)" && git push; }
